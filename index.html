<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Task Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<div class="top">
<h1>📋 Smart Task Manager</h1>
<button id="darkBtn">🌙 Dark</button>
</div>

<div class="form">
<input id="taskInput" placeholder="Nhập công việc...">
<input type="date" id="deadline">
<button class="addBtn" onclick="addTask()">Thêm</button>
</div>

    <input 
        class="search" 
        id="search" 
        placeholder="🔎 Tìm kiếm..." 
        onkeyup="renderTasks()">

    <div id="aiSuggest" class="ai-box">
            🤖 AI đang chờ gợi ý...
        </div>
    <div class="filters">
            <button onclick="setFilter('all')">Tất cả</button>
            <button onclick="setFilter('active')">Chưa xong</button>
            <button onclick="setFilter('done')">Hoàn thành</button>
        </div>

    <div id="taskList"></div>

        <div class="progressBox">
        <p id="status"></p>
        <div class="progress">
        <div class="bar" id="bar"></div>
    </div>
    </div>
    </div>
    <script src="script.js"></script>
    </body>
</html>
